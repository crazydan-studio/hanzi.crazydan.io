<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汉字 | 友情赞助</title>
</head>
<body class="bg-gray-50 min-h-screen dark:bg-gray-900" x-data="donateApp()">

  <div class="max-w-3xl mx-auto px-4 py-6">
    <div x-data="pageHeader({ title: '友情赞助', mb: 'mb-6' })" x-html="html"></div>

    <section class="panel p-4 md:p-6">
      <h2 class="text-lg font-bold mb-2">支持汉字网</h2>
      <p class="mb-4 text-sm text-gray-600 dark:text-gray-300">
        感谢您的热心支持！您的赞助将用于本项目的持续开发与维护，让更多人免费使用汉字笔画数据。
      </p>

      <!-- 付款备注醒目提示 -->
      <div class="mb-5 rounded-lg border-2 border-amber-400 bg-amber-50 p-4 text-center dark:border-amber-500 dark:bg-amber-900/20">
        <p class="text-sm font-bold text-amber-700 dark:text-amber-300">付款时请在备注中注明「汉字网」或「hanzi」，以便我们记录您的支持！</p>
      </div>

      <!-- 收款码 -->
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
        <div class="flex flex-col items-center gap-2 rounded-lg border border-gray-200 p-4 dark:border-gray-600">
          <span class="text-sm font-bold text-blue-600">支付宝</span>
          <img :src="qrUrl('alipay.jpg')" alt="支付宝收款码"
            class="w-full max-w-[160px] rounded border border-gray-200 dark:border-gray-600">
        </div>
        <div class="flex flex-col items-center gap-2 rounded-lg border border-gray-200 p-4 dark:border-gray-600">
          <span class="text-sm font-bold text-green-600">微信</span>
          <img :src="qrUrl('wechat.png')" alt="微信收款码"
            class="w-full max-w-[160px] rounded border border-gray-200 dark:border-gray-600">
        </div>
        <div class="flex flex-col items-center gap-2 rounded-lg border border-gray-200 p-4 dark:border-gray-600">
          <span class="text-sm font-bold text-indigo-600">PayPal</span>
          <img :src="qrUrl('hanzi-site.png')" alt="PayPal 收款码"
            class="w-full max-w-[160px] rounded border border-gray-200 dark:border-gray-600">
        </div>
      </div>

      <p class="mt-5 text-center text-sm text-gray-600 dark:text-gray-300">
        再次感谢您的热心支持！
      </p>
      <p class="mt-2 text-center">
        <a :href="donateListUrl"
          target="_blank" rel="noopener" class="btn-sm">友情赞助清单 →</a>
      </p>
    </section>
  </div>

  <footer x-data="appFooter()" x-html="html"></footer>

  <script type="module" src="/src/donate/main.js"></script>
</body>
</html>
