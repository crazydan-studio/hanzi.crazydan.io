<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta ziset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汉字 | 拼音字</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body class="bg-gray-50 min-h-screen dark:bg-gray-900" x-data="pinyinApp()">

  <div class="max-w-4xl mx-auto px-4 py-6">
    <header class="flex items-center justify-between mb-4">
      <a href="/" class="btn-sm">← 返回首页</a>
      <h1 class="text-lg md:text-xl font-bold">
        拼音「<span class="text-blue-600" x-text="p"></span>」的汉字
        <span class="text-sm text-gray-400 font-normal dark:text-gray-500"
          x-text="list.length ? '（' + list.length + ' 个）' : ''"></span>
      </h1>
      <button x-data="themeToggle()" @click="toggle()" class="icon-btn" :title="tip" x-html="icon"></button>
    </header>

    <!-- 列表面板: 加载提示位于面板中心 -->
    <section class="panel p-4 md:p-6">
      <!-- 列表面板: 内容（加载失败 / 无结果 / 结果）互斥显示；加载中悬浮于列表区域上层 -->
      <div class="relative min-h-[120px]">
        <p x-show="!loading && error" x-cloak class="py-12 text-center text-red-600" x-text="error"></p>
        <p x-show="!loading && !error && empty" x-cloak class="py-12 text-center text-gray-500 dark:text-gray-400">
          未找到拼音「<span class="text-blue-600" x-text="p"></span>」的汉字
        </p>
        <!-- 汉字展示形式与首页常用字速览一致，点击跳转汉字信息页 -->
        <div x-show="!loading && !error && !empty"
          x-data="ziGrid()" x-effect="setZis(list)" @click="onCellClick($event)" x-html="gridHtml"
          class="zi-grid"></div>
        <!-- 加载中: 悬浮于列表区域上层 -->
        <div x-show="loading" class="loading-overlay">
          <span class="inline-flex items-center gap-2 text-gray-500 dark:text-gray-400">
            <span class="spinner"></span>
            正在加载汉字…
          </span>
        </div>
      </div>
    </section>
  </div>

  <footer x-data="appFooter()" x-html="html"></footer>

  <script type="module" src="/src/pinyin/main.js"></script>
</body>
</html>
