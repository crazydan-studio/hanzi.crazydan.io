<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>汉字 | 汉字书写</title>
</head>
<body class="bg-gray-50 min-h-screen dark:bg-gray-900">

  <div class="max-w-6xl mx-auto p-4 md:p-6" x-data="strokeEditor()">
    <div x-data="pageHeader({ backClick: 'goBack()', title: '汉字书写', wrap: true, size: 'lg', mb: 'mb-6' })" x-html="html"></div>

    <!-- 笔画编辑器（独立页面）: 公共书写板 strokePad 经 padOpts 回调输出数据，
         编辑器组合书写板并持有服务端状态（API 耦合仅在此层） -->
    <section>
      <p x-show="error" class="text-red-600 text-sm mb-2" x-text="error"></p>

      <!-- zi-info（内联于编辑器作用域）: 只读信息 + 结构可编辑 + 笔顺参考 -->
      <div class="panel p-4 md:p-5 mb-4">
        <template x-if="zi">
          <div>
            <!-- 面板标题 + 右上角: 汉典网该字信息页链接（独立成行） -->
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-sm font-bold">汉字信息</h3>
              <a :href="zdicUrl" target="_blank" rel="noopener" class="btn-sm inline-flex items-center gap-1">
                汉典网详情
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </a>
            </div>
            <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
              <span class="text-4xl font-bold font-kaiti" x-text="zi.zi"></span>
              <span class="text-gray-700 font-pinyin dark:text-gray-200" x-text="`读音: ${zi.pinyin.map(p => symbolPinyin(p)).join('、')}`"></span>
              <span class="text-gray-500 text-sm dark:text-gray-400" x-text="`笔画数: ${zi.total_stroke_count}`"></span>
              <!-- 部首/结构/笔顺参考: 靠右侧布局 -->
              <div class="ml-auto flex flex-wrap items-center gap-x-4 gap-y-2">
                <!-- 部首: 可编辑（同步后端） -->
                <label class="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-300">
                  部首
                  <input type="text" maxlength="10" class="input !w-16 !py-1"
                    :value="zi.radical || ''"
                    @change="updateRadical(zi, $event.target.value)">
                </label>
                <!-- 结构: 唯一可编辑字段 -->
                <label class="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-300">
                  结构
                  <select class="input !w-auto !py-1"
                    @change="updateZiStructure(zi, $event.target.value)">
                    <template x-for="st in ZI_STRUCTURES" :key="st.code">
                      <option :value="st.code" :selected="zi.structure === st.code"
                        x-text="structureLabel(st.code)"></option>
                    </template>
                  </select>
                </label>
                <!-- 笔顺参考图开关 -->
                <button @click="toggleStrokeRef()" class="btn-sm"
                  :class="showStrokeRef ? 'btn-active' : 'bg-white dark:bg-gray-800'">
                  笔顺参考
                </button>
              </div>
            </div>
            <!-- 笔顺参考图（汉典网楷体笔顺图） -->
            <div x-show="showStrokeRef" class="mt-3">
              <div class="flex flex-wrap items-end gap-4">
                <img :src="strokeRefUrl" alt="笔顺参考" referrerpolicy="no-referrer"
                  class="border border-gray-200 rounded bg-white max-w-full dark:border-gray-600 dark:bg-gray-900"
                  @load="strokeRefError = false"
                  @error="strokeRefError = true">
                <p x-show="strokeRefError" class="text-xs text-gray-500 dark:text-gray-400">
                  笔顺图加载失败（需联网访问汉典网）
                </p>
              </div>
            </div>
          </div>
        </template>
        <p x-show="!zi" class="text-gray-500 dark:text-gray-400">正在加载…</p>
      </div>

      <!-- 响应式: 移动端竖屏上下堆叠，桌面左右分栏 -->
      <div class="flex flex-col lg:flex-row gap-4">
        <!-- 左侧: 书写板（书写/回放双模式 + 田字格背景） -->
        <div class="w-full lg:w-1/2">
          <div x-data="strokePad(padOpts)">
            <!-- 模式切换（与列表页过滤按钮/其他页面 btn-sm 样式一致） -->
            <div class="mb-2 flex gap-1">
              <button @click="switchMode('write')" class="btn-sm"
                :class="mode === 'write' ? 'btn-active' : 'bg-white dark:bg-gray-800'">书写</button>
              <button @click="switchMode('playback')" class="btn-sm"
                :class="mode === 'playback' ? 'btn-active' : 'bg-white dark:bg-gray-800'">回放</button>
            </div>

            <!-- 画布容器: 宽度自适应（移动端竖屏缩放显示，内部坐标恒为500×500） -->
            <div class="relative border rounded bg-white p-2 shadow-sm w-full mx-auto dark:bg-gray-800 dark:border-gray-700">
              <canvas
                x-ref="canvas"
                @pointerdown.prevent="onPointerDown($event)"
                @pointermove.prevent="onPointerMove($event)"
                @pointerup.prevent="onPointerUp($event)"
                @pointercancel.prevent="onPointerCancel($event)"
                @touchstart.prevent
                @touchmove.prevent
                class="touch-none select-none block mx-auto"
                :class="mode === 'write' ? 'cursor-crosshair' : 'cursor-default'"
              ></canvas>
              <!-- 字体失败提示（非阻塞，不遮挡田字格）:
                   字体加载等待由全局页面遮罩负责；此处仅失败时给出提示 -->
              <div x-show="mode === 'write' && fontError" x-cloak
                class="pointer-events-none absolute inset-x-0 top-1 z-10 flex justify-center">
                <span class="float-badge px-3 py-0.5 text-xs">
                  楷体字体加载失败，无法书写
                </span>
              </div>
            </div>

            <!-- 田字格/光栅实测盒信息（画布下方，两种模式均显示; 盒不可用时隐藏） -->
            <p x-show="canvasInfoText" class="mt-1 text-center text-xs text-gray-400 dark:text-gray-500"
              x-text="canvasInfoText"></p>

            <!-- 书写模式工具条: 撤销/重做/清空(恢复) 状态一致且互斥 -->
            <div class="mt-2 flex flex-wrap items-center gap-2" x-show="mode === 'write'">
              <button @click="canRestore() ? restoreCleared() : clearPad()"
                :disabled="!canClear() && !canRestore()"
                class="btn btn-gray"
                x-text="canRestore() ? '恢复' : '清空'"></button>
              <button @click="redo()" :disabled="!canRedo()"
                class="btn btn-gray">重做</button>
              <button @click="undoStroke()" :disabled="!canUndo()"
                class="btn btn-gray">撤销</button>
              <!-- 笔触宽度选择（移动端画布缩小，默认特粗） -->
              <div class="flex items-center gap-1 ml-2">
                <template x-for="w in PEN_WIDTHS" :key="w">
                  <button @click="setPenWidth(w)"
                    class="px-2.5 py-2 rounded border flex items-center justify-center"
                    :class="penWidth === w ? 'bg-blue-500 border-blue-500' : 'bg-white border-gray-300 hover:bg-gray-100 dark:bg-gray-800 dark:border-gray-600 dark:hover:bg-gray-700'"
                    :title="(PEN_WIDTH_NAMES[w] || w) + '笔触'">
                    <span class="rounded-full"
                      :style="'width:' + (w / 2) + 'px;height:' + (w / 2) + 'px'"
                      :class="penWidth === w ? 'bg-white' : 'bg-gray-700'"></span>
                  </button>
                </template>
              </div>
            </div>

            <!-- 回放模式控制条（移动端自动换行） -->
            <div class="mt-2" x-show="mode === 'playback'">
              <div class="flex flex-wrap items-center gap-2">
                <button @click="resetPlayback()" :disabled="!hasPlaybackData"
                  class="btn btn-gray">重置</button>
                <button @click="togglePlayback()" :disabled="!hasPlaybackData"
                  class="btn btn-primary disabled:opacity-50">
                  <span x-text="playbackState === 'PLAYING' ? '暂停' : '播放'"></span>
                </button>

                <div class="flex items-center gap-2">
                  <label class="text-sm text-gray-600 dark:text-gray-300">速度:</label>
                  <input type="range" min="0.25" max="4" step="0.25"
                    x-model.number="playbackSpeed" @input="onPlaybackSpeedChange()" class="w-24">
                  <span class="text-sm text-gray-600 dark:text-gray-300" x-text="playbackSpeed + 'x'"></span>
                </div>

                <div class="flex items-center gap-2 ml-2">
                  <label class="text-sm text-gray-600 dark:text-gray-300">笔画:</label>
                  <span class="text-sm font-medium" x-text="playbackLabel"></span>
                </div>
              </div>

              <!-- 笔画进度指示器（点击单独播放对应笔画动画；单笔播完后续保持未播放态） -->
              <div class="mt-2 flex gap-1" x-show="hasPlaybackData">
                <template x-for="(stroke, index) in playbackStrokes" :key="stroke.id">
                  <div class="h-1.5 flex-1 rounded cursor-pointer"
                    @click="selectAndPlay(playbackStrokes[index].id)"
                    :class="{
                      'bg-green-500': indicatorState(index) === 'done',
                      'bg-blue-500': indicatorState(index) === 'active',
                      'bg-gray-300 dark:bg-gray-600': indicatorState(index) === 'pending'
                    }"></div>
                </template>
              </div>
              <p x-show="!hasPlaybackData" class="mt-2 text-sm text-gray-500 dark:text-gray-400">
                暂无笔画轨迹数据，请切换到"书写"模式录入并保存笔画
              </p>
            </div>
          </div>
        </div>

        <!-- 右侧: 笔画列表（先书写，再在行内定类型；回放模式只读并联动高亮） -->
        <div class="w-full lg:w-1/2">
          <!-- stroke-list（内联于编辑器作用域） -->
          <div class="panel">
            <div class="p-2 font-medium text-sm border-b flex items-center justify-between dark:border-gray-700">
              <span>
                笔画列表 (共 <span x-text="strokes.length"></span> 笔)
              </span>
              <span class="text-xs font-normal"
                :class="padMode === 'playback' ? 'text-blue-600' : 'text-gray-400'"
                x-text="padMode === 'playback' ? '回放模式 · 点击笔画行即可播放' : '书写模式'"></span>
            </div>
            <div x-show="strokes.length === 0 && zi" class="p-3 text-sm text-gray-500 dark:text-gray-400">尚无笔画，请在左侧画布书写</div>
            <template x-for="s in strokes" :key="s.id">
              <div class="flex items-center justify-between px-3 py-1.5 border-b border-gray-200 text-sm select-none dark:border-gray-700"
                :draggable="padMode === 'write' && !isTouch"
                @dragstart="onStrokeDragStart($event, s)"
                @dragover.prevent="onStrokeDragOver($event, s)"
                @drop.prevent="onStrokeDrop($event, s)"
                @dragend="onStrokeDragEnd()"
                @click="padMode === 'write' ? selectStroke(s) : selectAndPlay(s.id)"
                @mouseenter="hoverStroke(s.id)"
                @mouseleave="hoverStroke(null)"
                :class="{
                  'opacity-60': s.isPending,
                  // 重绘目标: 醒目高亮
                  'bg-amber-50 border-l-4 border-amber-400 dark:bg-amber-900/30 dark:border-amber-500': redrawStroke?.id === s.id,
                  // 行选中高亮（书写模式点击选中/取消; 回放模式播放中联动/非播放保持选中）:
                  // 注意: 两模式共用同一类键，须合并条件避免对象键覆盖导致选中不高亮
                  'bg-blue-100 border-l-4 border-blue-500 dark:bg-blue-900/40 dark:border-blue-500':
                    (padMode === 'write' && selectedStrokeId === s.id) ||
                    (padMode === 'playback' && rowHighlightId === s.id),
                  // 书写模式悬停: 高亮并提示可拖拽（暗黑主题适配）
                  'hover:bg-blue-50 dark:hover:bg-gray-700 cursor-grab active:cursor-grabbing': padMode === 'write' && !s.isPending && !isTouch,
                  // 回放中已完成笔画淡化
                  'opacity-50': isPlaybackCompleted(s.id),
                  // 回放模式: 点击行选中该笔画并单笔播放
                  'cursor-pointer hover:bg-blue-50 dark:hover:bg-gray-700': padMode === 'playback'
                }">
                <!-- 拖拽把手（回放模式隐藏；触摸设备改为上下按钮排序） -->
                <span class="text-gray-400 mr-1" aria-hidden="true" x-show="padMode === 'write' && !isTouch">⠿</span>
                <!-- 触摸设备: 上移/下移按钮 -->
                <span class="flex flex-col mr-1" x-show="padMode === 'write' && isTouch">
                  <button @click.stop="moveStroke(s, -1)"
                    :disabled="strokes.indexOf(s) === 0"
                    class="text-gray-500 leading-none disabled:opacity-30 px-0.5">▲</button>
                  <button @click.stop="moveStroke(s, 1)"
                    :disabled="strokes.indexOf(s) === strokes.length - 1"
                    class="text-gray-500 leading-none disabled:opacity-30 px-0.5">▼</button>
                </span>
                <span class="font-bold w-8" x-text="s.stroke_order"></span>
                <span class="flex-1 truncate"
                  :class="s.stroke_type === 0 ? 'text-gray-400 italic' : ''"
                  x-text="strokeTypesMap[s.stroke_type]?.name || '未指定'"></span>
                <!-- 行内笔画类型选择（仅书写模式显示；重绘目标行隐藏）:
                     分组下拉经公共组件 strokeTypeSelect 渲染（横/竖/撇/捺/折/提/钩） -->
                <select
                  x-show="padMode === 'write' && redrawStroke?.id !== s.id"
                  x-data="strokeTypeSelect({ selected: () => s.stroke_type, onChange: (code) => updateStrokeType(s, code) })"
                  class="text-xs border border-gray-300 rounded px-1 py-0.5 mr-2 bg-white max-w-[5.5rem] dark:border-gray-600 dark:bg-gray-800"
                  :class="s.stroke_type === 0 ? 'border-amber-400 text-amber-600' : ''"
                  @click.stop
                  @change="onChange($event)"
                  x-html="optionsHtml"></select>
                <!-- 重绘目标行: 取消按钮（重绘/删除按钮与类型下拉框已隐藏） -->
                <span x-show="padMode === 'write' && redrawStroke?.id === s.id" class="flex items-center gap-2">
                  <button @click="cancelRedraw()"
                    class="text-amber-600 text-xs hover:text-amber-700">取消</button>
                </span>
                <!-- 重绘/删除按钮（仅书写模式显示，重绘目标行隐藏），间隔加大 -->
                <span x-show="padMode === 'write' && redrawStroke?.id !== s.id" class="flex items-center gap-2">
                  <button @click="startRedraw(s)"
                    class="text-amber-600 text-xs hover:text-amber-700">重绘</button>
                  <button @click="onStrokeRemoveRequest({ strokeId: s.id, reason: 'delete' })"
                    class="text-red-500 text-xs hover:text-red-700">删除</button>
                </span>
              </div>
            </template>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer x-data="appFooter()" x-html="html"></footer>

  <script type="module" src="/src/strokes/write/main.js"></script>
</body>
</html>
