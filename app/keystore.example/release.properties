# 发布版签名配置模板
# 复制到 keystore/ 目录并填入实际值（keystore/ 整个目录不提交 git）:
#   cp keystore.example/release.properties keystore/release.properties
# 说明:
#   - storeFile 为发布密钥库，建议使用绝对路径；相对路径相对于 android/ 模块目录解析
#   - 密钥库可用 keytool 生成: keytool -genkeypair -v -keystore release.keystore -alias hanzi -keyalg RSA -keysize 2048 -validity 10000
storeFile=/绝对/路径/release.keystore
storePassword=请替换为密钥库口令
keyAlias=hanzi
keyPassword=请替换为密钥口令
