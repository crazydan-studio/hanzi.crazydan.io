<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HanziStroke 汉字书写</title>
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-6xl mx-auto p-6" x-data="strokeEditor()">
    <header class="flex flex-wrap items-center justify-between gap-2 mb-6">
      <h1 class="text-2xl font-bold">HanziStroke 汉字书写</h1>
      <!-- 返回列表: 恢复进入前的列表 URL（过滤/分页状态）并同步其他端；直接进入时回根目录 -->
      <button @click="goBack()" class="btn btn-primary">← 返回列表</button>
    </header>

    <!-- 笔画编辑器（独立页面）: 公共书写板 strokePad 经 padOpts 回调输出数据，
         编辑器组合书写板并持有服务端状态（API 耦合仅在此层） -->
    <section>
      <p x-show="error" class="text-red-600 text-sm mb-2" x-text="error"></p>

      <!-- character-info（内联于编辑器作用域）: 只读信息 + 结构可编辑 + 笔顺参考 -->
      <div class="border rounded p-4 mb-4 bg-white shadow-sm">
        <template x-if="character">
          <div>
            <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
              <span class="text-4xl font-bold font-kaiti" x-text="character.character"></span>
              <span class="text-gray-700" x-text="`读音: ${character.pinyin.join('、')}`"></span>
              <span class="text-gray-500 text-sm" x-text="`笔画数: ${character.total_stroke_count}`"></span>
              <!-- 结构: 唯一可编辑字段 -->
              <label class="flex items-center gap-2 text-sm text-gray-600 ml-auto">
                结构
                <select class="input !w-auto !py-1"
                  @change="updateCharacterStructure(character, $event.target.value)">
                  <template x-for="st in CHARACTER_STRUCTURES" :key="st.code">
                    <option :value="st.code" :selected="character.structure === st.code"
                      x-text="st.examples.length ? st.name + '（' + st.examples.join('·') + '）' : st.name"></option>
                  </template>
                </select>
              </label>
              <!-- 笔顺参考图开关 -->
              <button @click="toggleStrokeRef()" class="btn-sm"
                :class="showStrokeRef ? 'bg-blue-500 text-white border-blue-500' : ''">
                笔顺参考
              </button>
            </div>
            <!-- 笔顺参考图（strokeorder.com 外部图） -->
            <div x-show="showStrokeRef" class="mt-3">
              <div class="flex flex-wrap items-end gap-4">
                <img :src="strokeRefUrl" alt="笔顺参考"
                  class="border border-gray-200 rounded bg-white max-w-full"
                  @load="strokeRefError = false"
                  @error="strokeRefError = true">
                <p x-show="strokeRefError" class="text-xs text-gray-500">
                  笔顺图加载失败（需联网访问 strokeorder.com）
                </p>
              </div>
            </div>
          </div>
        </template>
        <p x-show="!character" class="text-gray-500">加载中...</p>
      </div>

      <!-- 响应式: 移动端竖屏上下堆叠，桌面左右分栏 -->
      <div class="flex flex-col lg:flex-row gap-4">
        <!-- 左侧: 书写板（书写/回放双模式 + 田字格背景） -->
        <div class="w-full lg:w-1/2">
          <div x-data="strokePad(padOpts)" x-ref="pad">
            <!-- 模式切换 -->
            <div class="mb-2 flex gap-2">
              <button @click="switchMode('write')"
                class="px-3 py-1 text-sm rounded border"
                :class="mode === 'write' ? 'bg-blue-500 text-white' : 'bg-white hover:bg-gray-100'">书写</button>
              <button @click="switchMode('playback')"
                class="px-3 py-1 text-sm rounded border"
                :class="mode === 'playback' ? 'bg-blue-500 text-white' : 'bg-white hover:bg-gray-100'">回放</button>
            </div>

            <!-- 画布容器: 宽度自适应（移动端竖屏缩放显示，内部坐标恒为500×500） -->
            <div class="relative border rounded bg-white p-2 shadow-sm w-full mx-auto">
              <canvas
                x-ref="canvas"
                @pointerdown.prevent="onPointerDown($event)"
                @pointermove.prevent="onPointerMove($event)"
                @pointerup.prevent="onPointerUp($event)"
                @pointercancel.prevent="onPointerCancel($event)"
                @touchstart.prevent
                @touchmove.prevent
                class="touch-none select-none block mx-auto"
                :class="mode === 'write' ? 'cursor-crosshair' : 'cursor-default'"
              ></canvas>
              <!-- 字体加载等待遮罩（加载完成后自动消失） -->
              <div x-show="mode === 'write' && !fontReady"
                class="absolute inset-0 z-10 bg-white/80 backdrop-blur-[1px] flex flex-col items-center justify-center gap-2 rounded">
                <span class="inline-block w-5 h-5 border-2 border-gray-300 border-t-blue-500 rounded-full animate-spin"></span>
                <span class="text-sm text-gray-600">楷体字体加载中...</span>
              </div>
            </div>

            <!-- 书写模式工具条（与播放按钮同尺寸） -->
            <div class="mt-2 flex flex-wrap items-center gap-3" x-show="mode === 'write'">
              <button @click="undo()" :disabled="strokes.length === 0"
                class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600 disabled:opacity-50">撤销</button>
              <button @click="clearPad()" :disabled="strokes.length === 0"
                class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600 disabled:opacity-50">清空</button>
              <!-- 笔触宽度选择（移动端画布缩小，默认特粗） -->
              <div class="flex items-center gap-1 ml-2">
                <template x-for="w in PEN_WIDTHS" :key="w">
                  <button @click="setPenWidth(w)"
                    class="px-2.5 py-2 rounded border flex items-center justify-center"
                    :class="penWidth === w ? 'bg-blue-500 border-blue-500' : 'bg-white border-gray-300 hover:bg-gray-100'"
                    :title="(w === 6 ? '细' : w === 12 ? '标准' : w === 18 ? '粗' : '特粗') + '笔触'">
                    <span class="rounded-full"
                      :style="'width:' + (w / 2) + 'px;height:' + (w / 2) + 'px'"
                      :class="penWidth === w ? 'bg-white' : 'bg-gray-700'"></span>
                  </button>
                </template>
              </div>
            </div>

            <!-- 回放模式控制条（移动端自动换行） -->
            <div class="mt-2" x-show="mode === 'playback'">
              <div class="flex flex-wrap items-center gap-3">
                <button @click="togglePlayback()" :disabled="!hasPlaybackData"
                  class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 disabled:opacity-50">
                  <span x-text="playbackState === 'PLAYING' ? '暂停' : '播放'"></span>
                </button>
                <button @click="resetPlayback()" :disabled="!hasPlaybackData"
                  class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600 disabled:opacity-50">重置</button>

                <div class="flex items-center gap-2">
                  <label class="text-sm text-gray-600">速度:</label>
                  <input type="range" min="0.25" max="4" step="0.25"
                    x-model.number="playbackSpeed" @input="onPlaybackSpeedChange()" class="w-24">
                  <span class="text-sm text-gray-600" x-text="playbackSpeed + 'x'"></span>
                </div>

                <div class="flex items-center gap-2 ml-2">
                  <label class="text-sm text-gray-600">笔画:</label>
                  <span class="text-sm font-medium" x-text="playbackLabel"></span>
                </div>
              </div>

              <!-- 笔画进度指示器（点击单独播放对应笔画动画；单笔播完后续保持未播放态） -->
              <div class="mt-2 flex gap-1" x-show="hasPlaybackData">
                <template x-for="(stroke, index) in playbackStrokes" :key="stroke.id">
                  <div class="h-1.5 flex-1 rounded cursor-pointer"
                    @click="selectAndPlay(playbackStrokes[index].id)"
                    :class="{
                      'bg-green-500': indicatorState(index) === 'done',
                      'bg-blue-500': indicatorState(index) === 'active',
                      'bg-gray-300': indicatorState(index) === 'pending'
                    }"></div>
                </template>
              </div>
              <p x-show="!hasPlaybackData" class="mt-2 text-sm text-gray-500">
                暂无笔画轨迹数据，请切换到"书写"模式录入并保存笔画
              </p>
            </div>
          </div>
        </div>

        <!-- 右侧: 笔画列表（先书写，再在行内定类型；回放模式只读并联动高亮） -->
        <div class="w-full lg:w-1/2">
          <!-- stroke-list（内联于编辑器作用域） -->
          <div class="border rounded bg-white shadow-sm">
            <div class="p-2 font-medium text-sm border-b flex items-center justify-between">
              <span>
                笔画列表 (共 <span x-text="strokes.length"></span> 笔)
              </span>
              <span class="text-xs font-normal"
                :class="padMode === 'playback' ? 'text-blue-600' : 'text-gray-400'"
                x-text="padMode === 'playback' ? '回放模式 · 点击笔画行即可播放' : '书写模式'"></span>
            </div>
            <div x-show="strokes.length === 0" class="p-3 text-sm text-gray-500">尚无笔画，请在左侧画布书写</div>
            <template x-for="s in strokes" :key="s.id">
              <div class="flex items-center justify-between px-3 py-1.5 border-b text-sm select-none"
                :draggable="padMode === 'write' && !isTouch"
                @dragstart="onStrokeDragStart($event, s)"
                @dragover.prevent="onStrokeDragOver($event, s)"
                @drop.prevent="onStrokeDrop($event, s)"
                @dragend="onStrokeDragEnd()"
                @click="padMode === 'playback' && selectAndPlay(s.id)"
                @mouseenter="hoverStroke(s.id)"
                @mouseleave="hoverStroke(null)"
                :class="{
                  'opacity-60': s.isPending,
                  'hover:bg-blue-50 cursor-grab active:cursor-grabbing': padMode === 'write' && !s.isPending && !isTouch,
                  // 回放联动高亮: 播放中显示正在绘制的笔画；非播放时保持选中笔画
                  'bg-blue-100 border-l-4 border-blue-500': padMode === 'playback' && rowHighlightId === s.id,
                  // 回放中已完成笔画淡化
                  'opacity-50': isPlaybackCompleted(s.id),
                  // 回放模式: 点击行选中该笔画并单笔播放
                  'cursor-pointer hover:bg-blue-50': padMode === 'playback'
                }">
                <!-- 拖拽把手（回放模式隐藏；触摸设备改为上下按钮排序） -->
                <span class="text-gray-400 mr-1" aria-hidden="true" x-show="padMode === 'write' && !isTouch">⠿</span>
                <!-- 触摸设备: 上移/下移按钮 -->
                <span class="flex flex-col mr-1" x-show="padMode === 'write' && isTouch">
                  <button @click.stop="moveStroke(s, -1)"
                    :disabled="strokes.indexOf(s) === 0"
                    class="text-gray-500 leading-none disabled:opacity-30 px-0.5">▲</button>
                  <button @click.stop="moveStroke(s, 1)"
                    :disabled="strokes.indexOf(s) === strokes.length - 1"
                    class="text-gray-500 leading-none disabled:opacity-30 px-0.5">▼</button>
                </span>
                <span class="font-bold w-8" x-text="s.stroke_order"></span>
                <span class="flex-1 truncate"
                  :class="s.stroke_type === 0 ? 'text-gray-400 italic' : ''"
                  x-text="strokeTypesMap[s.stroke_type]?.name || '未指定'"></span>
                <!-- 行内笔画类型选择（仅书写模式显示） -->
                <select
                  x-show="padMode === 'write'"
                  class="text-xs border border-gray-300 rounded px-1 py-0.5 mr-2 bg-white max-w-[5.5rem]"
                  :class="s.stroke_type === 0 ? 'border-amber-400 text-amber-600' : ''"
                  @click.stop
                  @change="updateStrokeType(s, $event.target.value)">
                  <template x-for="t in STROKE_TYPES" :key="t.code">
                    <option :value="t.code" :selected="s.stroke_type === t.code">
                      <span x-text="t.shape"></span> <span x-text="t.name"></span>
                    </option>
                  </template>
                </select>
                <!-- 删除按钮（仅书写模式显示） -->
                <button x-show="padMode === 'write'"
                  @click="onStrokeRemoveRequest({ strokeId: s.id })"
                  class="text-red-500 text-xs hover:text-red-700">删除</button>
              </div>
            </template>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="/write/main.js"></script>
</body>
</html>
